[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinygrad-core"
version = "0.1.0"
description = "A reverse-mode automatic differentiation engine and neural network library built on NumPy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.4", "torch>=2.0"]

[tool.setuptools]
packages = ["tinygrad_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
