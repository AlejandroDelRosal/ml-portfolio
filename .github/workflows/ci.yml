name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Lint (ruff)
        run: ruff check . --exit-zero
      - name: Test requirements.txt projects
        run: |
          status=0
          for req in $(find . -mindepth 2 -name requirements.txt); do
            project_dir=$(dirname "$req")
            echo "Testing $project_dir"
            pip install -r "$req"
            (cd "$project_dir" && python -m pytest -q) || status=1
          done
          exit $status
      - name: Test packaged projects
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          status=0
          for manifest in $(find . -mindepth 2 -name pyproject.toml); do
            project_dir=$(dirname "$manifest")
            echo "Testing $project_dir"
            pip install -e "$project_dir[dev]"
            (cd "$project_dir" && python -m pytest -q) || status=1
          done
          exit $status
